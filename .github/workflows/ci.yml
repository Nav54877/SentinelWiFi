name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile sentinel.py sentinelwifi/*.py
      - name: Passive-only audit
        run: |
          ! grep -ri "deauth\|inject\|handshake\|crack" sentinelwifi/
          grep -rL "For auditing networks you own or are authorized to test" \
            sentinel.py sentinelwifi/*.py | wc -l | grep -q '^0$'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo mode smoke test
        run: python sentinel.py demo --json | python -m json.tool > /dev/null
      - name: Selftest smoke test
        run: python sentinel.py selftest || true
